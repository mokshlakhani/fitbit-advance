<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#050506">
  <title>DataStrap</title>
  <meta name="description" content="A private, self-hosted dashboard for your Fitbit health data.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=97">
</head>
<body>
  <header class="bar">
    <div class="bar-inner">
      <a class="brand" href="#/" aria-label="DataStrap, today">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg>
        <span>DataStrap</span>
      </a>

      <div class="date-nav" role="group" aria-label="Day">
        <button class="icon-btn" id="prevDay" type="button" aria-label="Previous day">
          <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M165.66,202.34a8,8,0,0,1-11.32,11.32l-80-80a8,8,0,0,1,0-11.32l80-80a8,8,0,0,1,11.32,11.32L91.31,128Z"/></svg>
        </button>
        <button class="date-btn" id="dateBtn" type="button">
          <span id="dateText">Loading</span>
        </button>
        <input type="date" id="datePicker" class="sr-only" tabindex="-1" aria-hidden="true">
        <button class="icon-btn" id="nextDay" type="button" aria-label="Next day">
          <svg viewBox="0 0 256 256" fill="currentColor" aria-hidden="true"><path d="M181.66,133.66l-80,80a8,8,0,0,1-11.32-11.32L164.69,128,90.34,53.66a8,8,0,0,1,11.32-11.32l80,80A8,8,0,0,1,181.66,133.66Z"/></svg>
        </button>
      </div>

      <div class="avatar" id="avatar" aria-hidden="true"></div>
    </div>
  </header>

  <div class="demo-banner" id="demoBanner" role="status" hidden>
    <span>You’re looking at <b>sample data</b> for a fictional person.</span>
    <span>Run <code>python3 setup.py</code> to connect your Fitbit.</span>
  </div>
  <main id="main" class="page" tabindex="-1"></main>

  <footer class="foot" id="foot"></footer>
  <div class="tooltip" id="tooltip" role="status" hidden></div>

  <script src="icons.js?v=97"></script>
  <script src="app.js?v=97"></script>
</body>
</html>
